[project]
name = "github-ai-weekly"
version = "0.1.0"
description = "GitHub AI 相关开源库每周排名：抓取快照、计算增量、生成 HTML 周报"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
github-ai-weekly = "github_ai_weekly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_ai_weekly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
